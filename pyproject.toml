[project]
name = "letterboxd-mcp"
version = "0.1.0"
description = "A local-first, read-only MCP server for public Letterboxd data"
readme = "README.md"
authors = [
    { name = "GuptaJiHardik", email = "hardikjiio25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "fastmcp>=4.0.3",
    "pydantic>=2.11.0",
    "requests>=2.32.0",
]

[project.scripts]
letterboxd-mcp = "letterboxd_mcp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
